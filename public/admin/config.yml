local_backend: true

backend:
  name: github
  repo: YOUR_ORG/YOUR_REPO
  branch: main
  base_url: https://bakkenshale.com
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /images

default_fields:
  - { label: "Title", name: "title", widget: "string" }
  - { label: "Description", name: "description", widget: "text" }
  - { label: "Hero Title", name: "heroTitle", widget: "string", required: false }
  - { label: "Hero Tagline", name: "heroTagline", widget: "string", required: false }
  - { label: "Publish Date", name: "pubDate", widget: "datetime", required: false }
  - { label: "Author", name: "author", widget: "string", required: false }
  - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
  - { label: "Category", name: "category", widget: "string", required: false }
  - { label: "Body", name: "body", widget: "markdown" }

collections:
  - name: "bsp-news-news"
    label: "Bakken News - News"
    folder: "src/content/bsp-news/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Hero Title", name: "heroTitle", widget: "string", required: false }
      - { label: "Hero Tagline", name: "heroTagline", widget: "string", required: false }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", required: false }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "press-press-releases"
    label: "Press - Press Releases"
